<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-admin-BG">
    <div class="login-card">
        <div class="login-card-icon">🔐</div>

        <h1 class="login-card-title">เข้าสู่ระบบ</h1>
        <p class="login-card-subtitle">สำหรับผู้ดูแลระบบ ThaiMeSook</p>

        <div id="errorMsg" class="login-error" style="display:none;">
            Username หรือ Password ไม่ถูกต้อง
        </div>

        <form action="/admin/login" method="post" class="login-form">
            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="login-actions">
                <button type="submit" class="login-submit-btn">เข้าสู่ระบบ</button>
            </div>
        </form>
    </div>

    <script>
        if (window.location.search.includes("error=1")) {
            document.getElementById("errorMsg").style.display = "block";
        }
    </script>
</body>
</html>
